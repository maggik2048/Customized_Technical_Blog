<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dark Academia Library</title>

<style>

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0f1115;
  font-family: Georgia, serif;
}

canvas {
  display: block;
}

</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x0f1115);

scene.fog = new THREE.Fog(
  0x0f1115,
  18,
  52
);



/* =========================
   CAMERA
========================= */

const camera = new THREE.OrthographicCamera(
  window.innerWidth / -90,
  window.innerWidth / 90,
  window.innerHeight / 90,
  window.innerHeight / -90,
  0.1,
  1000
);

camera.position.set(11, 13, 32);

camera.lookAt(0, 5, 0);



/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.outputEncoding = THREE.sRGBEncoding;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 0.92;

document.body.appendChild(
  renderer.domElement
);



/* =========================
   LIGHTING
========================= */

const ambient =
  new THREE.AmbientLight(
    0xffffff,
    0.24
  );

scene.add(ambient);


const light =
  new THREE.DirectionalLight(
    0xffffff,
    2.4
  );

light.position.set(5, 18, 10);

light.castShadow = true;

light.shadow.mapSize.width = 2048;
light.shadow.mapSize.height = 2048;

light.shadow.camera.near = 1;
light.shadow.camera.far = 80;

scene.add(light);



/* =========================
   FLOOR
========================= */

const floorGeometry =
  new THREE.PlaneGeometry(70, 70);

const floorMaterial =
  new THREE.MeshStandardMaterial({

    color: 0x15171b,

    roughness: 0.94,

    metalness: 0.04

  });

const floor =
  new THREE.Mesh(
    floorGeometry,
    floorMaterial
  );

floor.rotation.x = -Math.PI / 2;

floor.position.y = -2.4;

floor.receiveShadow = true;

scene.add(floor);



/* =========================
   DARK LUXURY COLORS
========================= */

const colors = [

  0x0a0a0b,
  0x111315,
  0x1a1d22,
  0x131c28,
  0x182433,
  0x242830,
  0x2a1d17,
  0x1c1412,
  0x2a2620,
  0x10161d

];



/* =========================
   BOOK DATA
========================= */

const books = [

  {
    title: "Advanced Calculus",
    author: "Spivak"
  },

  {
    title: "Linear Algebra",
    author: "Strang"
  },

  {
    title: "Real Analysis",
    author: "Rudin"
  },

  {
    title: "Complex Variables",
    author: "Ahlfors"
  },

  {
    title: "Abstract Algebra",
    author: "Dummit & Foote"
  },

  {
    title: "Differential Geometry",
    author: "do Carmo"
  },

  {
    title: "Topology",
    author: "Munkres"
  },

  {
    title: "Functional Analysis",
    author: "Kreyszig"
  },

  {
    title: "Tensor Calculus",
    author: "Schutz"
  },

  {
    title: "PDE",
    author: "Evans"
  },

  {
    title: "Probability Theory",
    author: "Feller"
  },

  {
    title: "Statistics",
    author: "Casella"
  },

  {
    title: "Numerical Analysis",
    author: "Burden"
  },

  {
    title: "Discrete Math",
    author: "Rosen"
  },

  {
    title: "Dynamical Systems",
    author: "Strogatz"
  },

  {
    title: "Fourier Analysis",
    author: "Stein"
  },

  {
    title: "Set Theory",
    author: "Jech"
  },

  {
    title: "Number Theory",
    author: "Hardy & Wright"
  }

];



/* =========================
   TEXTURE GENERATOR
========================= */

function createBookTexture(title, author) {

  const canvas = document.createElement("canvas");

  canvas.width = 2048;
  canvas.height = 256;

  const ctx = canvas.getContext("2d");



  /* BACKGROUND */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      canvas.width,
      0
    );

  gradient.addColorStop(0, "#111");
  gradient.addColorStop(1, "#191919");

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );



  /* SUBTLE FRAME */

  ctx.strokeStyle =
    "rgba(212,175,55,0.35)";

  ctx.lineWidth = 4;

  ctx.strokeRect(
    12,
    12,
    canvas.width - 24,
    canvas.height - 24
  );



  /* LEFT ORNAMENT */

  ctx.fillStyle = "#d4af37";

  ctx.font =
    "bold 70px Georgia";

  ctx.textAlign = "left";

  ctx.textBaseline = "middle";

  ctx.fillText(
    "✦",
    60,
    canvas.height / 2
  );



  /* MINI DECOR LINES */

  ctx.fillRect(
    140,
    54,
    12,
    150
  );

  ctx.fillRect(
    165,
    74,
    5,
    110
  );



  /* TITLE */

  ctx.font =
    "bold 84px Georgia";

  ctx.fillStyle = "#d8b85d";

  ctx.textAlign = "center";

  ctx.fillText(
    title,
    canvas.width / 2 + 40,
    108
  );



  /* AUTHOR */

  ctx.font =
    "italic 42px Georgia";

  ctx.fillStyle =
    "rgba(220,200,150,0.88)";

  ctx.fillText(
    author,
    canvas.width / 2 + 40,
    176
  );



  /* RIGHT VERTICAL TEXT */

  ctx.save();

  ctx.translate(
    canvas.width - 80,
    canvas.height / 2
  );

  ctx.rotate(
    -Math.PI / 2
  );

  ctx.font =
    "italic 34px Georgia";

  ctx.fillStyle =
    "rgba(212,175,55,0.65)";

  ctx.fillText(
    author.toUpperCase(),
    0,
    0
  );

  ctx.restore();



  /* GOLD DETAIL */

  ctx.fillStyle =
    "rgba(212,175,55,0.9)";

  ctx.fillRect(
    0,
    18,
    canvas.width,
    4
  );

  ctx.fillRect(
    0,
    canvas.height - 22,
    canvas.width,
    4
  );



  const texture =
    new THREE.CanvasTexture(canvas);

  texture.anisotropy = 16;

  return texture;
}



/* =========================
   BOOK STACK
========================= */

let y = 0;

for (let i = 0; i < books.length; i++) {

  const width =
    5.5 + Math.random() * 2.5;

  const height =
    0.34 + Math.random() * 0.34;

  const depth = 1.65;

  const color =
    colors[
      Math.floor(
        Math.random() * colors.length
      )
    ];

  const texture =
    createBookTexture(
      books[i].title,
      books[i].author
    );



  const materials = [

    new THREE.MeshStandardMaterial({
      color: color
    }),

    new THREE.MeshStandardMaterial({
      color: color
    }),

    new THREE.MeshStandardMaterial({
      color: color
    }),

    new THREE.MeshStandardMaterial({
      color: color
    }),

    new THREE.MeshStandardMaterial({

      map: texture,

      roughness: 0.28,

      metalness: 0.16

    }),

    new THREE.MeshStandardMaterial({
      color: color
    })

  ];



  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const book =
    new THREE.Mesh(
      geometry,
      materials
    );

  book.position.y = y;

  book.rotation.y =
    (Math.random() - 0.5) * 0.05;

  book.rotation.z =
    (Math.random() - 0.5) * 0.012;

  book.castShadow = true;

  book.receiveShadow = true;

  scene.add(book);



  /* =========================
     MAIN GOLD STRIPE
  ========================= */

  if (Math.random() > 0.12) {

    const stripeGeometry =
      new THREE.BoxGeometry(
        width * 0.96,
        0.022,
        depth + 0.02
      );

    const stripeMaterial =
      new THREE.MeshStandardMaterial({

        color: 0xd4af37,

        roughness: 0.16,

        metalness: 1

      });

    const stripe =
      new THREE.Mesh(
        stripeGeometry,
        stripeMaterial
      );

    stripe.position.y =
      y + height * 0.16;

    stripe.position.z = 0.002;

    stripe.rotation.y =
      book.rotation.y;

    scene.add(stripe);
  }



  /* =========================
     SECOND STRIPE
  ========================= */

  if (Math.random() > 0.45) {

    const stripe2Geometry =
      new THREE.BoxGeometry(
        width * 0.92,
        0.012,
        depth + 0.02
      );

    const stripe2Material =
      new THREE.MeshStandardMaterial({

        color: 0xb8932f,

        roughness: 0.15,

        metalness: 1

      });

    const stripe2 =
      new THREE.Mesh(
        stripe2Geometry,
        stripe2Material
      );

    stripe2.position.y =
      y - height * 0.18;

    stripe2.position.z = 0.002;

    stripe2.rotation.y =
      book.rotation.y;

    scene.add(stripe2);
  }



  y += height + 0.04;
}



/* =========================
   CAMERA FLOAT
========================= */

function animate() {

  requestAnimationFrame(animate);

  const t = performance.now() * 0.0003;

  camera.position.x =
    Math.sin(t) * 1.1 + 10;

  camera.position.y =
    12 + Math.cos(t * 1.4) * 0.3;

  camera.lookAt(0, 5, 0);

  renderer.render(
    scene,
    camera
  );
}

animate();



/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  () => {

    camera.left =
      window.innerWidth / -90;

    camera.right =
      window.innerWidth / 90;

    camera.top =
      window.innerHeight / 90;

    camera.bottom =
      window.innerHeight / -90;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
