<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sparse Pencil Hatching Sketch</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      max-width: 100%;
    }
  </style>
</head>
<body>

<input type="file" id="upload" accept="image/*" />

<label>
  Threshold:
  <input type="range" id="threshold" min="0" max="255" value="120" />
</label>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const thresholdInput = document.getElementById("threshold");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();

upload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    img = new Image();
    img.onload = draw;
    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

thresholdInput.addEventListener("input", draw);

function grayAt(data, x, y, w) {
  const i = (y * w + x) * 4;
  return 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
}

function draw() {
  if (!img.src) return;

  canvas.width = img.width;
  canvas.height = img.height;

  ctx.drawImage(img, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  const w = canvas.width;
  const h = canvas.height;

  const threshold = +thresholdInput.value;

  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1;

  //  더 sparse하게
  const step = 20;        // 이전보다 훨씬 넓게
  const strokeLen = 38;   // 더 길게

  for (let y = 1; y < h - 1; y += step) {
    for (let x = 1; x < w - 1; x += step) {

      const gx =
        -grayAt(data, x-1, y-1, w) - 2*grayAt(data, x-1, y, w) - grayAt(data, x-1, y+1, w)
        + grayAt(data, x+1, y-1, w) + 2*grayAt(data, x+1, y, w) + grayAt(data, x+1, y+1, w);

      const gy =
        -grayAt(data, x-1, y-1, w) - 2*grayAt(data, x, y-1, w) - grayAt(data, x+1, y-1, w)
        + grayAt(data, x-1, y+1, w) + 2*grayAt(data, x, y+1, w) + grayAt(data, x+1, y+1, w);

      const mag = Math.sqrt(gx*gx + gy*gy);

      if (mag > threshold * 0.5) {

        const angle = Math.atan2(gy, gx);
        const t = angle + Math.PI / 2;

        //  약간 랜덤 넣어서 손그림 느낌
        const jitter = (Math.random() - 0.5) * 0.3;

        const dx = Math.cos(t + jitter);
        const dy = Math.sin(t + jitter);

        const len = strokeLen;

        const x1 = x - dx * len;
        const y1 = y - dy * len;
        const x2 = x + dx * len;
        const y2 = y + dy * len;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
  }
}
</script>

</body>
</html>
