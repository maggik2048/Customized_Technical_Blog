<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Threshold + Pencil Hatching</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      max-width: 100%;
    }
  </style>
</head>
<body>

<input type="file" id="upload" accept="image/*" />

<label>
  Threshold:
  <input type="range" id="threshold" min="0" max="255" value="128" />
</label>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const thresholdInput = document.getElementById("threshold");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();

// 해치 설정
const blockSize = 6; // 해치 밀도 (작을수록 촘촘)
const hatchAngle = 45; // 방향 고정 (대각선)

upload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    img = new Image();
    img.onload = () => draw();
    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

thresholdInput.addEventListener("input", draw);

function draw() {
  if (!img.src) return;

  canvas.width = img.width;
  canvas.height = img.height;

  ctx.drawImage(img, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  const threshold = parseInt(thresholdInput.value);

  // 1단계: 흑백 이진화
  const bw = [];
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
    const v = gray < threshold ? 1 : 0; // 1 = black

    bw.push(v);
  }

  // 캔버스 초기화 (원본 제거 후 해치만 표시)
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // (선택) 원본을 희미하게 깔고 싶으면 주석 해제
  // ctx.globalAlpha = 0.2;
  // ctx.drawImage(img, 0, 0);
  // ctx.globalAlpha = 1;

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1;

  // 2단계: 블록 단위로 해치 그리기
  for (let y = 0; y < canvas.height; y += blockSize) {
    for (let x = 0; x < canvas.width; x += blockSize) {

      let blackCount = 0;
      let total = 0;

      // 블록 내부 픽셀 검사
      for (let j = 0; j < blockSize; j++) {
        for (let i = 0; i < blockSize; i++) {
          const px = x + i;
          const py = y + j;
          if (px >= canvas.width || py >= canvas.height) continue;

          const idx = py * canvas.width + px;
          total++;
          if (bw[idx] === 1) blackCount++;
        }
      }

      // 검은 영역 비율 기준
      if (blackCount / total > 0.5) {
        drawHatch(x, y, blockSize);
      }
    }
  }
}

// 고정 방향 해치 (45도)
function drawHatch(x, y, size) {
  ctx.beginPath();
  ctx.moveTo(x, y + size);
  ctx.lineTo(x + size, y);
  ctx.stroke();
}
</script>

</body>
</html>
