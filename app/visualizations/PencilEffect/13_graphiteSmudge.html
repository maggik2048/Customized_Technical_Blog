<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realistic Charcoal Smudge Engine</title>

<style>
    body{
        margin:0;
        background:#d4d4d4;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        height:100vh;
        overflow:hidden;
        font-family:Arial;
        gap:15px;
    }

    .toolbar{
        display:flex;
        gap:18px;
        align-items:center;
        flex-wrap:wrap;
    }

    canvas{
        background:white;
        box-shadow:0 10px 30px rgba(0,0,0,0.25);
        cursor:crosshair;
        max-width:92vw;
        max-height:82vh;
    }

    label{
        font-size:14px;
    }
</style>
</head>

<body>

<div class="toolbar">

    <input type="file"
           id="upload"
           accept="image/*">

    <label>
        Brush Size
        <input type="range"
               id="size"
               min="5"
               max="120"
               value="30">
    </label>

    <label>
        Smudge Strength
        <input type="range"
               id="strength"
               min="1"
               max="100"
               value="65">
    </label>

    <label>
        Pigment Deposit
        <input type="range"
               id="deposit"
               min="0"
               max="100"
               value="3">
    </label>

    <label>
        Noise Overlay
        <input type="range"
               id="noise"
               min="0"
               max="100"
               value="28">
    </label>

    <label>
        Grain Scale
        <input type="range"
               id="grainScale"
               min="1"
               max="20"
               value="7">
    </label>

</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const upload =
    document.getElementById("upload");

const sizeSlider =
    document.getElementById("size");

const strengthSlider =
    document.getElementById("strength");

const depositSlider =
    document.getElementById("deposit");

const noiseSlider =
    document.getElementById("noise");

const grainScaleSlider =
    document.getElementById("grainScale");

let drawing = false;

// =====================================================
// IMAGE UPLOAD
// =====================================================

upload.addEventListener("change", e => {

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = () => {

        canvas.width =
            img.width;

        canvas.height =
            img.height;

        ctx.drawImage(img,0,0);
    };

    img.src =
        URL.createObjectURL(file);
});

// =====================================================
// MOUSE EVENTS
// =====================================================

canvas.addEventListener("mousedown", () => {
    drawing = true;
});

canvas.addEventListener("mouseup", () => {
    drawing = false;
});

canvas.addEventListener("mouseleave", () => {
    drawing = false;
});

canvas.addEventListener("mousemove", e => {

    if(!drawing) return;

    const rect =
        canvas.getBoundingClientRect();

    const scaleX =
        canvas.width / rect.width;

    const scaleY =
        canvas.height / rect.height;

    const x =
        (e.clientX - rect.left)
        * scaleX;

    const y =
        (e.clientY - rect.top)
        * scaleY;

    smudge(x,y);
});

// =====================================================
// OVERLAY BLEND
// =====================================================

function overlayBlend(base,blend){

    base /= 255;
    blend /= 255;

    let result;

    if(base < 0.5){

        result =
            2 * base * blend;

    }else{

        result =
            1 -
            2 *
            (1 - base) *
            (1 - blend);
    }

    return result * 255;
}

// =====================================================
// MAIN ENGINE
// =====================================================

function smudge(cx,cy){

    const radius =
        parseInt(sizeSlider.value);

    const smudgeStrength =
        parseInt(strengthSlider.value)
        / 100;

    const depositStrength =
        parseInt(depositSlider.value)
        / 100;

    const noiseStrength =
        parseInt(noiseSlider.value)
        / 100;

    const grainScale =
        parseInt(grainScaleSlider.value);

    const startX =
        Math.max(
            0,
            Math.floor(cx - radius)
        );

    const startY =
        Math.max(
            0,
            Math.floor(cy - radius)
        );

    const endX =
        Math.min(
            canvas.width,
            Math.floor(cx + radius)
        );

    const endY =
        Math.min(
            canvas.height,
            Math.floor(cy + radius)
        );

    const imageData =
        ctx.getImageData(
            startX,
            startY,
            endX - startX,
            endY - startY
        );

    const data =
        imageData.data;

    const copy =
        new Uint8ClampedArray(data);

    const width =
        imageData.width;

    const height =
        imageData.height;

    // =====================================================
    // COLLECT DARK GRAPHITE
    // =====================================================

    let darkR = 0;
    let darkG = 0;
    let darkB = 0;
    let countDark = 0;

    for(let y=0; y<height; y++){

        for(let x=0; x<width; x++){

            const dx =
                x - radius;

            const dy =
                y - radius;

            const dist =
                Math.sqrt(dx*dx + dy*dy);

            if(dist > radius)
                continue;

            const i =
                (y * width + x) * 4;

            const r = copy[i];
            const g = copy[i+1];
            const b = copy[i+2];

            const brightness =
                (r+g+b)/3;

            if(brightness < 180){

                darkR += r;
                darkG += g;
                darkB += b;

                countDark++;
            }
        }
    }

    if(countDark === 0)
        return;

    darkR /= countDark;
    darkG /= countDark;
    darkB /= countDark;

    // =====================================================
    // PIXEL PROCESSING
    // =====================================================

    for(let y=0; y<height; y++){

        for(let x=0; x<width; x++){

            const dx =
                x - radius;

            const dy =
                y - radius;

            const dist =
                Math.sqrt(dx*dx + dy*dy);

            if(dist > radius)
                continue;

            const fade =
                1 - (dist / radius);

            const i =
                (y * width + x) * 4;

            const r = copy[i];
            const g = copy[i+1];
            const b = copy[i+2];

            // =================================================
            // LOCAL BLUR
            // =================================================

            let totalR = 0;
            let totalG = 0;
            let totalB = 0;
            let blurCount = 0;

            for(let oy=-2; oy<=2; oy++){

                for(let ox=-2; ox<=2; ox++){

                    const nx = x + ox;
                    const ny = y + oy;

                    if(
                        nx < 0 ||
                        ny < 0 ||
                        nx >= width ||
                        ny >= height
                    ){
                        continue;
                    }

                    const ni =
                        (ny * width + nx) * 4;

                    totalR += copy[ni];
                    totalG += copy[ni+1];
                    totalB += copy[ni+2];

                    blurCount++;
                }
            }

            const blurR =
                totalR / blurCount;

            const blurG =
                totalG / blurCount;

            const blurB =
                totalB / blurCount;

            // =================================================
            // SMUDGE
            // =================================================

            let nr =
                r + (blurR - r)
                * smudgeStrength
                * fade;

            let ng =
                g + (blurG - g)
                * smudgeStrength
                * fade;

            let nb =
                b + (blurB - b)
                * smudgeStrength
                * fade;

            // =================================================
            // GRAPHITE DEPOSITION
            // =================================================

            nr = Math.min(
                nr,
                nr + (darkR - nr)
                * depositStrength
                * fade
            );

            ng = Math.min(
                ng,
                ng + (darkG - ng)
                * depositStrength
                * fade
            );

            nb = Math.min(
                nb,
                nb + (darkB - nb)
                * depositStrength
                * fade
            );

            // =================================================
            // NOISE OVERLAY
            // =================================================

            const grainX =
                Math.floor(x / grainScale);

            const grainY =
                Math.floor(y / grainScale);

            const random =
                (
                    Math.sin(
                        grainX * 12.9898 +
                        grainY * 78.233
                    ) * 43758.5453
                ) % 1;

            const grain =
                Math.abs(random) * 255;

            const overlayAmount =
                noiseStrength
                * fade;

            nr =
                nr * (1 - overlayAmount)
                +
                overlayBlend(nr,grain)
                * overlayAmount;

            ng =
                ng * (1 - overlayAmount)
                +
                overlayBlend(ng,grain)
                * overlayAmount;

            nb =
                nb * (1 - overlayAmount)
                +
                overlayBlend(nb,grain)
                * overlayAmount;

            // =================================================
            // CLAMP
            // =================================================

            nr = Math.max(
                0,
                Math.min(255,nr)
            );

            ng = Math.max(
                0,
                Math.min(255,ng)
            );

            nb = Math.max(
                0,
                Math.min(255,nb)
            );

            data[i]   = nr;
            data[i+1] = ng;
            data[i+2] = nb;
        }
    }

    ctx.putImageData(
        imageData,
        startX,
        startY
    );
}

</script>

</body>
</html>
