<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soft Threshold Binarization</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      max-width: 100%;
    }
  </style>
</head>
<body>

<input type="file" id="upload" accept="image/*" />

<label>
  Threshold:
  <input type="range" id="threshold" min="0" max="255" value="128" />
</label>

<label>
  Softness:
  <input type="range" id="softness" min="1" max="100" value="10" />
</label>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const thresholdInput = document.getElementById("threshold");
const softnessInput = document.getElementById("softness");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let grain = new Image();
let grainLight = new Image();

// main grain
grain.src = "../../../../public/images/pencildrawing/pencilgrain.png";

// bright-only grain
grainLight.src = "../../../../public/images/pencildrawing/pencilgrain_lightsoft.png";

let grainReady = false;
let grainLightReady = false;

grain.onload = () => {
  grainReady = true;
  console.log("grain loaded", grain.naturalWidth);
  draw();
};

grainLight.onload = () => {
  grainLightReady = true;
  console.log("grain light loaded", grainLight.naturalWidth);
  draw();
};

grain.onerror = () => console.log("grain FAILED");
grainLight.onerror = () => console.log("grain LIGHT FAILED");

upload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    img = new Image();
    img.onload = () => draw();
    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

thresholdInput.addEventListener("input", draw);
softnessInput.addEventListener("input", draw);

function smoothstep(edge0, edge1, x) {
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function draw() {
  if (!img.src) return;

  canvas.width = img.width;
  canvas.height = img.height;

  ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(img, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  const threshold = parseInt(thresholdInput.value) / 255;
  const softness = parseInt(softnessInput.value) / 255;

  const low = threshold - softness;
  const high = threshold + softness;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const gray = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

    let value = smoothstep(low, high, gray);
    const out = value * 255;

    data[i] = out;
    data[i + 1] = out;
    data[i + 2] = out;
  }

  ctx.putImageData(imageData, 0, 0);

  // =========================
  // 1. normal grain (전체)
  // =========================
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.25;

  if (grainReady) {
    ctx.drawImage(grain, 0, 0, canvas.width, canvas.height);
  }

  // =========================
  // 2. bright-only grain (마스크)
  // =========================
  if (grainLightReady) {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;

    // temporary mask canvas
    const maskCanvas = document.createElement("canvas");
    maskCanvas.width = canvas.width;
    maskCanvas.height = canvas.height;
    const mctx = maskCanvas.getContext("2d");

    mctx.drawImage(grainLight, 0, 0, canvas.width, canvas.height);

    const maskData = mctx.getImageData(0, 0, canvas.width, canvas.height).data;

    for (let i = 0; i < d.length; i += 4) {
      const gray = (d[i] + d[i + 1] + d[i + 2]) / 3;

      // 밝은 영역만 적용 (threshold)
      const mask = gray > 180 ? 1 : 0;

      d[i] = d[i] * (1 - mask) + maskData[i] * mask;
      d[i + 1] = d[i + 1] * (1 - mask) + maskData[i + 1] * mask;
      d[i + 2] = d[i + 2] * (1 - mask) + maskData[i + 2] * mask;
    }

    ctx.putImageData(imgData, 0, 0);
  }

  ctx.globalAlpha = 1.0;
  ctx.globalCompositeOperation = "source-over";
}
</script>

</body>
</html>
