<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wet Watercolor Brush</title>

<style>
    html, body {
        margin: 0;
        overflow: hidden;
        background: white;
    }

    canvas {
        display: block;
        cursor: crosshair;
    }
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

resize();

window.addEventListener("resize", resize);

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

let drawing = false;
let mouse = { x: 0, y: 0 };

const wetSpots = [];

canvas.addEventListener("mousedown", (e) => {
    drawing = true;
    updateMouse(e);
});

canvas.addEventListener("mouseup", () => {
    drawing = false;
});

canvas.addEventListener("mouseleave", () => {
    drawing = false;
});

canvas.addEventListener("mousemove", (e) => {
    updateMouse(e);

    if (drawing) {
        createInk(mouse.x, mouse.y);
    }
});

function updateMouse(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
}

function createInk(x, y) {

    // Main stroke
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fill();

    // Smaller and shorter watercolor spread
    wetSpots.push({
        x,
        y,
        radius: 3 + Math.random() * 3,
        alpha: 0.12,
        spread: 0.08 + Math.random() * 0.12,
        maxRadius: 18 + Math.random() * 10
    });
}

function animate() {

    // Very light blending
    ctx.fillStyle = "rgba(255,255,255,0.01)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = wetSpots.length - 1; i >= 0; i--) {

        const p = wetSpots[i];

        // Controlled spreading
        if (p.radius < p.maxRadius) {
            p.radius += p.spread;
        }

        // Faster fade
        p.alpha *= 0.97;

        const gradient = ctx.createRadialGradient(
            p.x, p.y, 0,
            p.x, p.y, p.radius
        );

        gradient.addColorStop(0, `rgba(0,0,0,${p.alpha})`);
        gradient.addColorStop(1, `rgba(0,0,0,0)`);

        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        // Remove earlier
        if (p.alpha < 0.01) {
            wetSpots.splice(i, 1);
        }
    }

    // Small pooling while holding
    if (drawing) {

        wetSpots.push({
            x: mouse.x + (Math.random() - 0.5) * 2,
            y: mouse.y + (Math.random() - 0.5) * 2,
            radius: 2 + Math.random() * 2,
            alpha: 0.05,
            spread: 0.05 + Math.random() * 0.08,
            maxRadius: 12 + Math.random() * 6
        });
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
