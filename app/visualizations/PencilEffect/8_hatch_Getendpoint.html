<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connected Hatch Stroke End Highlight</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      max-width: 100%;
    }
  </style>
</head>
<body>

<input type="file" id="upload" accept="image/*" />

<label>
  Threshold:
  <input type="range" id="threshold" min="0" max="255" value="128" />
</label>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const thresholdInput = document.getElementById("threshold");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();

const blockSize = 12;

upload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    img = new Image();
    img.onload = () => draw();
    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

thresholdInput.addEventListener("input", draw);

function draw() {
  if (!img.src) return;

  canvas.width = img.width;
  canvas.height = img.height;

  ctx.drawImage(img, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  const threshold = parseInt(thresholdInput.value);

  const bw = [];

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
    bw.push(gray < threshold ? 1 : 0);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1;

  const strokes = [];

  // 1) collect hatch segments
  const grid = [];

  for (let y = 0; y < canvas.height; y += blockSize) {
    for (let x = 0; x < canvas.width; x += blockSize) {

      let blackCount = 0;
      let total = 0;

      for (let j = 0; j < blockSize; j++) {
        for (let i = 0; i < blockSize; i++) {
          const px = x + i;
          const py = y + j;
          if (px >= canvas.width || py >= canvas.height) continue;

          const idx = py * canvas.width + px;
          total++;
          if (bw[idx] === 1) blackCount++;
        }
      }

      const ratio = blackCount / total;

      if (ratio > 0.65) {
        grid.push({ x, y });
      }
    }
  }

  // 2) group into strokes (simple adjacency clustering)
  const visited = new Set();

  function key(p) {
    return `${p.x},${p.y}`;
  }

  function neighbors(p) {
    return grid.filter(n =>
      (Math.abs(n.x - p.x) === blockSize && Math.abs(n.y - p.y) === blockSize)
    );
  }

  for (const p of grid) {
    if (visited.has(key(p))) continue;

    const stack = [p];
    const stroke = [];

    while (stack.length) {
      const cur = stack.pop();
      const k = key(cur);

      if (visited.has(k)) continue;
      visited.add(k);

      stroke.push(cur);

      const ns = neighbors(cur);
      for (const n of ns) {
        if (!visited.has(key(n))) {
          stack.push(n);
        }
      }
    }

    strokes.push(stroke);
  }

  // 3) draw strokes
  for (const stroke of strokes) {
    if (stroke.length === 0) continue;

    stroke.sort((a, b) => a.x + a.y - (b.x + b.y));

    for (let i = 0; i < stroke.length; i++) {
      const p = stroke[i];

      const x1 = p.x;
      const y1 = p.y + blockSize;
      const x2 = p.x + blockSize;
      const y2 = p.y;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // start (blue)
      ctx.fillStyle = "blue";
      ctx.beginPath();
      ctx.arc(x1, y1, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // end (purple or orange only if last in stroke)
      const isLast = (i === stroke.length - 1);

      ctx.fillStyle = isLast ? "orange" : "purple";
      ctx.beginPath();
      ctx.arc(x2, y2, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
</script>

</body>
</html>
