<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Threshold + Reduced Pencil Hatching</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      max-width: 100%;
    }
  </style>
</head>
<body>

<input type="file" id="upload" accept="image/*" />

<label>
  Threshold:
  <input type="range" id="threshold" min="0" max="255" value="128" />
</label>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const thresholdInput = document.getElementById("threshold");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();

//  해치 밀도 줄이기 (값 올라가면 = 해치 줄어듦)
const blockSize = 12; 

upload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    img = new Image();
    img.onload = () => draw();
    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

thresholdInput.addEventListener("input", draw);

function draw() {
  if (!img.src) return;

  canvas.width = img.width;
  canvas.height = img.height;

  ctx.drawImage(img, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  const threshold = parseInt(thresholdInput.value);

  // 1) grayscale → binary
  const bw = [];
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
    const v = gray < threshold ? 1 : 0;
    bw.push(v);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1;

  for (let y = 0; y < canvas.height; y += blockSize) {
    for (let x = 0; x < canvas.width; x += blockSize) {

      let blackCount = 0;
      let total = 0;

      for (let j = 0; j < blockSize; j++) {
        for (let i = 0; i < blockSize; i++) {
          const px = x + i;
          const py = y + j;
          if (px >= canvas.width || py >= canvas.height) continue;

          const idx = py * canvas.width + px;
          total++;
          if (bw[idx] === 1) blackCount++;
        }
      }

      const ratio = blackCount / total;

      // 🔧 더 강한 조건 → 해치 줄어듦
      if (ratio > 0.65) {
        drawHatch(x, y, blockSize);
      }
    }
  }
}

//  해치 + 시작/끝 점
function drawHatch(x, y, size) {
  const x1 = x;
  const y1 = y + size;
  const x2 = x + size;
  const y2 = y;

  // hatch line
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  // 시작점 (파랑)
  ctx.fillStyle = "blue";
  ctx.beginPath();
  ctx.arc(x1, y1, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // 끝점 (보라)
  ctx.fillStyle = "purple";
  ctx.beginPath();
  ctx.arc(x2, y2, 2.5, 0, Math.PI * 2);
  ctx.fill();
}
</script>

</body>
</html>
