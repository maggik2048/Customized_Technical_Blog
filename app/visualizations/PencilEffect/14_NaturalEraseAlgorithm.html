<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soft Graphite Eraser</title>

<style>
    body{
        margin:0;
        background:#ccc;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        height:100vh;
        gap:15px;
        overflow:hidden;
        font-family:Arial;
    }

    .toolbar{
        display:flex;
        gap:20px;
        align-items:center;
        flex-wrap:wrap;
    }

    canvas{
        background:white;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        cursor:crosshair;
        max-width:92vw;
        max-height:82vh;
    }

    label{
        font-size:14px;
    }
</style>
</head>

<body>

<div class="toolbar">

    <input type="file"
           id="upload"
           accept="image/*">

    <label>
        Eraser Size
        <input type="range"
               id="size"
               min="5"
               max="120"
               value="22">
    </label>

    <!-- VERY LOW ERASE -->
    <label>
        Erase Strength
        <input type="range"
               id="strength"
               min="1"
               max="100"
               value="10">
    </label>

    <!-- VERY HIGH SMUDGE -->
    <label>
        Smudge Amount
        <input type="range"
               id="smudge"
               min="0"
               max="100"
               value="100">
    </label>

</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const upload =
    document.getElementById("upload");

const sizeSlider =
    document.getElementById("size");

const strengthSlider =
    document.getElementById("strength");

const smudgeSlider =
    document.getElementById("smudge");

let isDrawing = false;

// =====================================================
// IMAGE INPUT
// =====================================================

upload.addEventListener("change", e => {

    const file =
        e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = () => {

        canvas.width =
            img.width;

        canvas.height =
            img.height;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0
        );
    };

    img.src =
        URL.createObjectURL(file);
});

// =====================================================
// SOFT GRAPHITE ERASER
// =====================================================

function softErase(cx,cy){

    const radius =
        parseInt(sizeSlider.value);

    // FIXED NORMALIZED VALUE
    const eraseStrength =
        parseInt(strengthSlider.value)
        / 100;

    const smudgeStrength =
        parseInt(smudgeSlider.value)
        / 100;

    const startX =
        Math.max(
            0,
            Math.floor(cx - radius)
        );

    const startY =
        Math.max(
            0,
            Math.floor(cy - radius)
        );

    const endX =
        Math.min(
            canvas.width,
            Math.floor(cx + radius)
        );

    const endY =
        Math.min(
            canvas.height,
            Math.floor(cy + radius)
        );

    const imageData =
        ctx.getImageData(
            startX,
            startY,
            endX - startX,
            endY - startY
        );

    const data =
        imageData.data;

    const copy =
        new Uint8ClampedArray(data);

    const width =
        imageData.width;

    const height =
        imageData.height;

    // =====================================================
    // PIXEL PROCESSING
    // =====================================================

    for(let y=0; y<height; y++){

        for(let x=0; x<width; x++){

            const dx =
                x - radius;

            const dy =
                y - radius;

            const dist =
                Math.sqrt(dx*dx + dy*dy);

            if(dist > radius)
                continue;

            const fade =
                1 - (dist / radius);

            const i =
                (y * width + x) * 4;

            const r =
                copy[i];

            const g =
                copy[i+1];

            const b =
                copy[i+2];

            // =================================================
            // SMALL LOCAL SMUDGE
            // =================================================

            let totalR = 0;
            let totalG = 0;
            let totalB = 0;
            let blurCount = 0;

            for(let oy=-1; oy<=1; oy++){

                for(let ox=-1; ox<=1; ox++){

                    const nx =
                        x + ox;

                    const ny =
                        y + oy;

                    if(
                        nx < 0 ||
                        ny < 0 ||
                        nx >= width ||
                        ny >= height
                    ){
                        continue;
                    }

                    const ni =
                        (ny * width + nx) * 4;

                    totalR += copy[ni];
                    totalG += copy[ni+1];
                    totalB += copy[ni+2];

                    blurCount++;
                }
            }

            const blurR =
                totalR / blurCount;

            const blurG =
                totalG / blurCount;

            const blurB =
                totalB / blurCount;

            // =================================================
            // STRONG GRAPHITE SMEAR
            // =================================================

            let nr =
                r + (blurR - r)
                * smudgeStrength*2
                * fade;

            let ng =
                g + (blurG - g)
                * smudgeStrength
                * fade;

            let nb =
                b + (blurB - b)
                * smudgeStrength
                * fade;

            // =================================================
            // VERY SOFT GRAPHITE LIFTING
            // =================================================

            nr =
                nr + (245 - nr)
                * eraseStrength
                * fade;

            ng =
                ng + (245 - ng)
                * eraseStrength
                * fade;

            nb =
                nb + (245 - nb)
                * eraseStrength
                * fade;

            data[i] =
                Math.max(
                    0,
                    Math.min(255,nr)
                );

            data[i+1] =
                Math.max(
                    0,
                    Math.min(255,ng)
                );

            data[i+2] =
                Math.max(
                    0,
                    Math.min(255,nb)
                );
        }
    }

    ctx.putImageData(
        imageData,
        startX,
        startY
    );
}

canvas.addEventListener("mousedown", e => {

    isDrawing = true;

    draw(e);
});

canvas.addEventListener("mouseup", () => {

    isDrawing = false;
});

canvas.addEventListener("mouseleave", () => {

    isDrawing = false;
});

canvas.addEventListener("mousemove", e => {

    if(!isDrawing) return;

    draw(e);
});

function draw(e){

    const rect =
        canvas.getBoundingClientRect();

    const scaleX =
        canvas.width / rect.width;

    const scaleY =
        canvas.height / rect.height;

    const x =
        (e.clientX - rect.left)
        * scaleX;

    const y =
        (e.clientY - rect.top)
        * scaleY;

    softErase(x,y);
}

</script>

</body>
</html>
