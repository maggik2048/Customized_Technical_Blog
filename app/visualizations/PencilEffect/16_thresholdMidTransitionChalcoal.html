<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soft Threshold Binarization with Pencil Texture</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      max-width: 100%;
    }
  </style>
</head>
<body>

<input type="file" id="upload" accept="image/*" />

<label>
  Threshold:
  <input type="range" id="threshold" min="0" max="255" value="128" />
</label>

<label>
  Softness:
  <input type="range" id="softness" min="1" max="100" value="10" />
</label>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const thresholdInput = document.getElementById("threshold");
const softnessInput = document.getElementById("softness");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();

// Texture image (pencil grain)
const pencilImg = new Image();
pencilImg.src = "C:/Users/ggabu/graphics-lab-v2/public/images/pencildrawing/pencilgrain.png";

upload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    img = new Image();
    img.onload = () => draw();
    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

thresholdInput.addEventListener("input", draw);
softnessInput.addEventListener("input", draw);

function smoothstep(edge0, edge1, x) {
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function draw() {
  if (!img.src) return;
  if (!pencilImg.complete) return;

  canvas.width = img.width;
  canvas.height = img.height;

  // Draw original image
  ctx.drawImage(img, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  // Create texture buffer
  const texCanvas = document.createElement("canvas");
  texCanvas.width = canvas.width;
  texCanvas.height = canvas.height;
  const texCtx = texCanvas.getContext("2d");
  texCtx.drawImage(pencilImg, 0, 0, canvas.width, canvas.height);
  const texData = texCtx.getImageData(0, 0, canvas.width, canvas.height).data;

  const threshold = parseInt(thresholdInput.value) / 255;
  const softness = parseInt(softnessInput.value) / 255;

  const low = threshold - softness;
  const high = threshold + softness;

  for (let i = 0; i < data.length; i += 4) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const gray = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

    let value = smoothstep(low, high, gray);

    const texR = texData[i];
    const texG = texData[i + 1];
    const texB = texData[i + 2];

    if (value < 0.5) {
      // Dark areas become pencil texture
      data[i] = texR;
      data[i + 1] = texG;
      data[i + 2] = texB;
    } else {
      // Light areas stay light/white
      const out = value * 255;
      data[i] = out;
      data[i + 1] = out;
      data[i + 2] = out;
    }
  }

  ctx.putImageData(imageData, 0, 0);
}
</script>

</body>
</html>
