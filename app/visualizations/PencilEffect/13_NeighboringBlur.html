<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realistic Charcoal Smudge Engine</title>

<style>
    body{
        margin:0;
        background:#d4d4d4;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        height:100vh;
        overflow:hidden;
        font-family:Arial;
        gap:15px;
    }

    .toolbar{
        display:flex;
        gap:18px;
        align-items:center;
        flex-wrap:wrap;
    }

    canvas{
        background:white;
        box-shadow:0 10px 30px rgba(0,0,0,0.25);
        cursor:crosshair;
        max-width:92vw;
        max-height:82vh;
    }

    label{
        font-size:14px;
    }
</style>
</head>

<body>

<div class="toolbar">

    <input type="file" id="upload" accept="image/*">

    <label>
        Brush Size
        <input type="range" id="size" min="5" max="120" value="30">
    </label>

    <label>
        Smudge Strength
        <input type="range" id="strength" min="1" max="100" value="65">
    </label>

    <label>
        Pigment Deposit
        <input type="range" id="deposit" min="0" max="100" value="50">
    </label>

</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const upload = document.getElementById("upload");

const sizeSlider = document.getElementById("size");
const strengthSlider = document.getElementById("strength");
const depositSlider = document.getElementById("deposit");

let drawing = false;

upload.addEventListener("change", e => {

    const file = e.target.files[0];
    if(!file) return;

    const img = new Image();

    img.onload = () => {

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img,0,0);
    };

    img.src = URL.createObjectURL(file);
});

canvas.addEventListener("mousedown", () => {
    drawing = true;
});

canvas.addEventListener("mouseup", () => {
    drawing = false;
});

canvas.addEventListener("mouseleave", () => {
    drawing = false;
});

canvas.addEventListener("mousemove", e => {

    if(!drawing) return;

    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    smudge(x,y);
});

function smudge(cx,cy){

    const radius =
        parseInt(sizeSlider.value);

    const smudgeStrength =
        parseInt(strengthSlider.value) / 100;

    const depositStrength =
        parseInt(depositSlider.value) / 100;

    const startX =
        Math.max(0, Math.floor(cx - radius));

    const startY =
        Math.max(0, Math.floor(cy - radius));

    const endX =
        Math.min(canvas.width, Math.floor(cx + radius));

    const endY =
        Math.min(canvas.height, Math.floor(cy + radius));

    const imageData = ctx.getImageData(
        startX,
        startY,
        endX - startX,
        endY - startY
    );

    const data = imageData.data;

    const copy = new Uint8ClampedArray(data);

    const width = imageData.width;
    const height = imageData.height;

    // =====================================================
    // collect average DARK charcoal pigment
    // =====================================================

    let darkR = 0;
    let darkG = 0;
    let darkB = 0;
    let countDark = 0;

    for(let y=0; y<height; y++){

        for(let x=0; x<width; x++){

            const dx = x - radius;
            const dy = y - radius;

            const dist = Math.sqrt(dx*dx + dy*dy);

            if(dist > radius) continue;

            const i = (y * width + x) * 4;

            const r = copy[i];
            const g = copy[i+1];
            const b = copy[i+2];

            const brightness = (r+g+b)/3;

            // ONLY use dark graphite tones
            if(brightness < 180){

                darkR += r;
                darkG += g;
                darkB += b;

                countDark++;
            }
        }
    }

    if(countDark === 0) return;

    darkR /= countDark;
    darkG /= countDark;
    darkB /= countDark;

    // =====================================================
    // smudge + dark charcoal deposition
    // =====================================================

    for(let y=0; y<height; y++){

        for(let x=0; x<width; x++){

            const dx = x - radius;
            const dy = y - radius;

            const dist = Math.sqrt(dx*dx + dy*dy);

            if(dist > radius) continue;

            const fade = 1 - (dist / radius);

            const i = (y * width + x) * 4;

            const r = copy[i];
            const g = copy[i+1];
            const b = copy[i+2];

            // =================================================
            // local blur averaging
            // =================================================

            let totalR = 0;
            let totalG = 0;
            let totalB = 0;
            let blurCount = 0;

            for(let oy=-2; oy<=2; oy++){

                for(let ox=-2; ox<=2; ox++){

                    const nx = x + ox;
                    const ny = y + oy;

                    if(nx < 0 || ny < 0 ||
                       nx >= width || ny >= height){
                        continue;
                    }

                    const ni = (ny * width + nx) * 4;

                    totalR += copy[ni];
                    totalG += copy[ni+1];
                    totalB += copy[ni+2];

                    blurCount++;
                }
            }

            const blurR = totalR / blurCount;
            const blurG = totalG / blurCount;
            const blurB = totalB / blurCount;

            // =================================================
            // TRUE charcoal smudge blur
            // =================================================

            let nr =
                r + (blurR - r) *
                smudgeStrength * fade;

            let ng =
                g + (blurG - g) *
                smudgeStrength * fade;

            let nb =
                b + (blurB - b) *
                smudgeStrength * fade;

            // =================================================
            // DARK charcoal pigment deposition
            // IMPORTANT:
            // ONLY darkens, NEVER lightens
            // =================================================

            nr = Math.min(
                nr,
                nr + (darkR - nr) *
                depositStrength * fade
            );

            ng = Math.min(
                ng,
                ng + (darkG - ng) *
                depositStrength * fade
            );

            nb = Math.min(
                nb,
                nb + (darkB - nb) *
                depositStrength * fade
            );

            data[i]   = nr;
            data[i+1] = ng;
            data[i+2] = nb;
        }
    }

    ctx.putImageData(imageData,startX,startY);
}

</script>

</body>
</html>
