<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smooth Streamline Vector Field</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Inter,sans-serif;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:32px;
}

h1{
  margin-bottom:8px;
  font-size:36px;
}

p{
  color:#9a9a9a;
  max-width:900px;
  text-align:center;
  line-height:1.7;
  margin-bottom:28px;
}

input{
  margin-bottom:24px;
  background:#111;
  color:white;
  border:1px solid #333;
  padding:12px;
  border-radius:12px;
}

canvas{
  max-width:92vw;
  border-radius:22px;
  border:1px solid #252525;
  box-shadow:0 0 50px rgba(255,255,255,0.06);
}

</style>
</head>
<body>

<h1>Image → Smooth Streamline Field</h1>

<p>
원래 gradient field 느낌은 유지하면서<br>
streamline propagation만 smooth 하게 개선한 버전
</p>

<input type="file" id="upload" accept="image/*" />

<canvas id="canvas"></canvas>

<script>

const upload = document.getElementById('upload')
const canvas = document.getElementById('canvas')
const ctx = canvas.getContext('2d')

let field = []
let W = 0
let H = 0

upload.addEventListener('change', e=>{

  const file = e.target.files[0]
  if(!file) return

  const reader = new FileReader()

  reader.onload = ()=>{

    const img = new Image()

    img.onload = ()=>{
      buildField(img)
    }

    img.src = reader.result
  }

  reader.readAsDataURL(file)

})

function buildField(img){

  W = canvas.width = img.width
  H = canvas.height = img.height

  ctx.drawImage(img,0,0)

  const imageData =
    ctx.getImageData(0,0,W,H)

  const data = imageData.data

  field = new Array(W * H)

  // 원래 local detail 유지
  for(let y=1; y<H-1; y++){

    for(let x=1; x<W-1; x++){

      const gx =
        brightness(data,x+1,y)
        -
        brightness(data,x-1,y)

      const gy =
        brightness(data,x,y+1)
        -
        brightness(data,x,y-1)

      const angle =
        Math.atan2(gy,gx)

      const mag =
        Math.sqrt(gx*gx + gy*gy)

      field[y*W+x] = {
        angle,
        mag
      }
    }
  }

  render()
}

function brightness(data,x,y){

  const i = (y*W+x)*4

  return (
    data[i] +
    data[i+1] +
    data[i+2]
  ) / 3
}

function sampleField(x,y){

  x = Math.floor(x)
  y = Math.floor(y)

  if(
    x<0 ||
    y<0 ||
    x>=W ||
    y>=H
  ) return null

  return field[y*W+x]
}

function render(){

  ctx.fillStyle = "rgba(0,0,0,0.94)"
  ctx.fillRect(0,0,W,H)

  const spacing = 34

  for(let y=spacing; y<H; y+=spacing){

    for(let x=spacing; x<W; x+=spacing){

      trace(x,y)
    }
  }
}

function trace(startX,startY){

  let x = startX
  let y = startY

  let currentAngle = null

  ctx.beginPath()
  ctx.moveTo(x,y)

  for(let i=0; i<140; i++){

    const v = sampleField(x,y)

    if(!v) break

    // 핵심:
    // direction inertia

    if(currentAngle === null){

      currentAngle = v.angle

    }else{

      let da =
        normalizeAngle(v.angle - currentAngle)

      // 얼마나 부드럽게 따라갈지
      currentAngle += da * 0.08
    }

    const speed =
      1.5 + v.mag * 0.045

    x += Math.cos(currentAngle) * speed
    y += Math.sin(currentAngle) * speed

    if(
      x<0 ||
      y<0 ||
      x>=W ||
      y>=H
    ) break

    ctx.lineTo(x,y)
  }

  const hue =
    (startX / W) * 220 + 160

  ctx.strokeStyle =
    `hsla(${hue},100%,70%,0.6)`

  ctx.lineWidth = 1.5

  ctx.stroke()
}

function normalizeAngle(a){

  while(a > Math.PI)
    a -= Math.PI * 2

  while(a < -Math.PI)
    a += Math.PI * 2

  return a
}

</script>

</body>
</html>
