<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebGL Metaball Demo</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- shader helpers ---
function createShader(gl, type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}
function createProgram(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
  }
  return p;
}

// --- vertex shader ---
const vs = createShader(gl, gl.VERTEX_SHADER, `
attribute vec2 aPos;
varying vec2 vUV;
void main(){
  vUV = aPos*0.5 + 0.5;
  gl_Position = vec4(aPos,0,1);
}`);

// --- fragment shader ---
const fs = createShader(gl, gl.FRAGMENT_SHADER, `
precision highp float;
varying vec2 vUV;
uniform float uTime;

float sphereSDF(vec3 p, vec3 c, float r){
    return length(p-c)-r;
}

float smoothMin(float a, float b, float k){
    float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
    return mix(b,a,h) - k*h*(1.0-h);
}

float map(vec3 p, float t){
    vec3 c1 = vec3(sin(t)*0.5,0.0,0.0);
    vec3 c2 = vec3(-sin(t)*0.5,0.0,0.0);
    float s1 = sphereSDF(p,c1,0.4);
    float s2 = sphereSDF(p,c2,0.4);
    return smoothMin(s1,s2,0.3);
}

vec3 getNormal(vec3 p, float t){
    float e=0.001;
    vec2 h=vec2(e,0);
    return normalize(vec3(
        map(p+vec3(h.x,0,0),t)-map(p-vec3(h.x,0,0),t),
        map(p+vec3(0,h.x,0),t)-map(p-vec3(0,h.x,0),t),
        map(p+vec3(0,0,h.x),t)-map(p-vec3(0,0,h.x),t)
    ));
}

void main(){
    vec2 uv = vUV*2.0 -1.0;
    vec3 ro = vec3(0,0,3);
    vec3 rd = normalize(vec3(uv,-1.5));
    float t=0.0;
    float d;
    for(int i=0;i<64;i++){
        vec3 p = ro + rd*t;
        d = map(p,uTime);
        if(d<0.001) break;
        t += d;
    }
    vec3 col = vec3(0.0);
    if(d<0.001){
        vec3 p = ro + rd*t;
        vec3 n = getNormal(p,uTime);
        float diff = dot(n,normalize(vec3(1,1,1)));
        col = vec3(0.2,0.5,1.0)*diff;
    }
    gl_FragColor = vec4(col,1.0);
}`);

const program = createProgram(vs, fs);

// --- buffer ---
const quad = new Float32Array([-1,-1,1,-1,-1,1,1,1]);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(program,'aPos');
const timeLoc = gl.getUniformLocation(program,'uTime');

function render(time){
    time *= 0.001;
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(program);
    gl.enableVertexAttribArray(posLoc);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.vertexAttribPointer(posLoc,2,gl.FLOAT,false,0,0);
    gl.uniform1f(timeLoc,time);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
